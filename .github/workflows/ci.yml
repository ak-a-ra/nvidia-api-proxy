name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  quality:
    # Lint, typecheck and format. Separate from the matrix above on purpose:
    # `npm test` stays plain `node --test` so the proxy's zero-dependency
    # promise still holds for anyone who just wants to run the suite. This job
    # is the only one that needs an install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # The spec ledger is a fenced YAML block inside a markdown file, and
      # PyYAML silently keeps the last value for a duplicate key. This script
      # negative-tests the reader so a broken ledger cannot pass unnoticed.
      - run: python3 scripts/check-state-yaml.py
