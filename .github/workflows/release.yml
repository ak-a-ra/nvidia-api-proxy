name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: python3 scripts/check-state-yaml.py

  release:
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        run: echo "version=v$(node -e "console.log(require('./package.json').version)")" >> $GITHUB_OUTPUT
      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "tag ${{ steps.version.outputs.version }} already exists; skipping tag creation"
          else
            git tag "${{ steps.version.outputs.version }}"
            git push origin "${{ steps.version.outputs.version }}"
          fi
      - name: Create GitHub release and upload source code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --repo ${{ github.repository }} \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Auto-generated release from commit ${{ github.sha }}. Zero-dependency Node.js ESM reverse proxy for NVIDIA NIM API. See README.md for setup and usage." \
            --generate-notes
      - name: Archive source code
        run: |
          git archive --format=tar.gz --prefix=nvidia-api-proxy-${{ steps.version.outputs.version }}/ HEAD > nvidia-api-proxy-${{ steps.version.outputs.version }}-source.tar.gz
      - name: Upload source code asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.version }}" \
            nvidia-api-proxy-${{ steps.version.outputs.version }}-source.tar.gz \
            --repo ${{ github.repository }}
