services:
  - type: web
    name: nvidia-api-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Pinned so the deployed runtime matches a CI-tested leg instead of
      # whatever Render defaults to (engines.node is ">=18.14" and Node 18 is
      # not in the CI matrix).
      - key: NODE_VERSION
        value: "24"
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_API_KEY
        sync: false
      - key: PROXY_AUTH_TOKEN
        sync: false
      # Pinned explicitly so dashboard drift cannot disable the idle watchdog:
      # if it is 0 (or > undici's internal 300s body timeout), a silent upstream
      # gets cut by undici itself with the opaque message
      # "The operation was aborted due to timeout" (UND_ERR_BODY_TIMEOUT)
      # instead of our clear "upstream idle timeout".
      - key: UPSTREAM_CONNECT_TIMEOUT_SECONDS
        value: "30"
      - key: UPSTREAM_IDLE_TIMEOUT_SECONDS
        value: "120"
      # Traffic guards — conservative defaults for a fresh Render blueprint.
      # PROXY_RPM / PROXY_TPM are deliberately NOT set here: they depend on the
      # operator's NVIDIA account quota and must be supplied by the operator.
      - key: PROXY_MAX_CONCURRENT_REQUESTS
        value: "16"
      - key: PROXY_MAX_QUEUE_SIZE
        value: "32"
      - key: PROXY_QUEUE_TIMEOUT_SECONDS
        value: "30"
      - key: PROXY_SAFETY_MARGIN_PCT
        value: "5"
      - key: PROXY_MAX_BUFFERED_BODY_BYTES
        value: "8388608"
