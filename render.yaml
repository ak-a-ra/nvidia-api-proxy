services:
  - type: web
    name: nvidia-api-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_API_KEY
        sync: false
      - key: PROXY_AUTH_TOKEN
        sync: false
