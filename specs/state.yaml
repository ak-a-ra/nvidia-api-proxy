  - decision: Task 4 limit variables are strict positive integers, and the margin is the only ranged one
    rationale: >-
      Decided 2026-09-30, for e04s01 task 4, before dispatch. The story table gives
      PROXY_MAX_CONCURRENT_REQUESTS an explicit "absent/blank/0 disables" carve-out and gives
      PROXY_MAX_QUEUE_SIZE, PROXY_QUEUE_TIMEOUT_SECONDS and PROXY_SAFETY_MARGIN_PCT none, so 0
      is fatal for the three. PROXY_SAFETY_MARGIN_PCT is an integer 0-50 inclusive, because the
      Gherkin scenario names 51 as the fatal case and 0 as valid. PROXY_QUEUE_TIMEOUT_SECONDS
      keeps the decimal-digits-only guard from task 3 rather than the lenient readSeconds
      fallback: it is a new operational variable, not one of the two existing timeout variables,
      and 0 seconds of queue wait silently turns queueing into immediate rejection. All four
      read into one limits object so no caller can read three defaults beside a half-configured
      concurrency ceiling; maxConcurrentRequests is the only nullable member. Reversal is one
      guard plus the test that pins it.
  - decision: Task 5 per-model limits reject the whole value, and reject entries that carry no budget
    rationale: >-
      Decided 2026-09-30, for e04s01 task 5, before dispatch. The story enumerates five fatal
      shapes (bad JSON, non-object root, empty model key, non-object entry, invalid rpm/tpm) and
      twice states the rule the other two derive from: a silently dropped model limit is a budget
      that appears to exist and does not, and a partially applied value fails open. So an entry
      supplying neither rpm nor tpm is fatal, and so is an unknown key inside an entry: a
      misspelled "rps" would otherwise vanish and leave the operator believing the model is
      capped. A model key that is not equal to its own trimmed form is fatal for the same reason,
      since it can never match a model ID; the empty-object root is accepted, because zero models
      is a well-formed statement that no per-model budget exists. The value is one rejection, not a
      per-row report, so no invalid entry can be adopted alongside a valid one. PROXY_MAX_BUFFERED_BODY_BYTES
      joins the existing limits object as maxBufferedBodyBytes, since it is a ceiling like
      maxQueueSize, and takes the plain positive-integer rule with 0 fatal: a zero-byte buffer
      rejects every request body. Per-model limits become a new top-level modelLimits field,
      parallel to rateLimit and separate from limits, which holds only scalar ceilings. The
      per-model numbers reuse readPositiveInteger after a typeof check, because JSON.parse has
      already destroyed the textual evidence the digits-only rule inspects: 1e3 is valid JSON and
      yields 1000, so the scientific-notation rejection is a property of env scalars only. The
      typeof check has to come first or a quoted "60" would pass, since String("60") is "60".
  - decision: Fatal messages name the type of an offending value, never its text
    rationale: >-
      Decided 2026-09-30, after the task 5 review, on the orchestrator's authority rather than
      the brief's. The brief said only "do not echo the whole document", which reads as a size
      rule; it is a robustness one. The fatal message for a non-number budget value called
      JSON.stringify on the offending value with no bound, so a 42 KB env var of 7000-deep
      nesting threw RangeError inside the fatal path: the process still exited 1, but stderr
      was a raw Node stack dump that never named the variable, which is the opposite of what
      the operator needs. Below the crash threshold the same expression put 36 KB of the
      operator's document on one stderr line. Objects and arrays now report their type through
      the existing typeName helper, and only primitives echo their text. The test for it cannot
      assert that stderr mentions PROXY_MODEL_LIMITS_JSON: a crash dump quotes the source line,
      so that assertion passes against the very crash it is meant to catch. It asserts the
      interpolated field path instead, which the dump renders literally as the model variable,
      and the absence of a stack dump. A second consequence is recorded in the task 7 ledger
      row: a fatal message that can itself crash is a path that must be re-proved by test, not
      by inspection, because inspection is exactly what missed it.
  - decision: A duplicate top-level model key stays accepted, and the gap is recorded rather than closed
    rationale: >-
      Decided 2026-09-30, after the task 5 review found it. PROXY_MODEL_LIMITS_JSON with a
      duplicated gpt key storing rpm first and tpm second keeps only tpm, so one of the two
      budgets the operator wrote disappears and the proxy starts silently. That is the same
      failure class the same commit makes fatal for a misspelled field, so the code is
      inconsistent with its own stated standard. Closing it in code is neither cheap nor clean:
      JSON.parse exposes no duplicate-key hook, so detection needs a reviver with per-holder
      bookkeeping that cannot know its own path, which makes the error message worse than the
      bug, and a regex over the raw text false-positives on nested keys. RFC 8259 leaves
      duplicate-name behavior implementation-defined and last-wins is what every JSON parser
      does, so this is a deliberate accepted gap, recorded in the task 7 ledger row as an
      accepted fail-open rather than an oversight. A model key containing a C0 control character
      is closed in the same round, because that one contradicts a rule the code already applies:
      a padded key is rejected for never matching a model ID, and a control character cannot
      match one either.
      Reversal is one guard plus the tests that pin it.
  - decision: The document check asserts each file's claim, not a phrase, and is negative-tested both ways
    rationale: >-
      Decided 2026-10-02, for e04s02 task 7, replacing a grep-based check that was
      vacuous. The old regex expected PROXY_MAX_CONCURRENT_REQUESTS to sit next to
