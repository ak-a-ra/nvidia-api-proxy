      now covers story specs as it was written, and it is green rather than relaxed.
  - decision: Admission state gets its own root-level module, and the wait is event-driven
    rationale: >-
      Decided 2026-10-02, for e04s02 planning. Three forks were open and all three were
      settled from repo precedent rather than left as questions. Ownership: a new
      root-level admission.js holds the active count, the FIFO list, and the per-ticket
      settled flag, on the config.js precedent and because #13 stories 59-61 and 135-138
      ask for one owner of limiter state; scattering a counter across four terminal
      branches in server.js is how a slot leaks or double-releases. Wait mechanism: a
      waiter is resolved by the release that frees capacity, never by a polling timer,
      because #13 story 68 forbids fine-grained busy polling and a poll wakes the event
      loop for every waiting client on every tick. Placement: the gate sits after
      authentication and after the unconfigured check, so an anonymous caller cannot
      distinguish a full queue from an authorized request, which would leak credential
      state and contradict the ordering ADR 0001 already fixes.
  - decision: Abort-aware and shutdown-safe admission are e04s03, not part of e04s02
    rationale: >-
      Decided 2026-10-02, for e04s02 planning, to keep the first traffic-changing slice
      small. A queued request whose client disconnects, and SIGTERM rejecting waiters
      with 503, are both named in issue #16 and are already sequenced there as e04s03.
      What e04s02 does guarantee is that a waiter cannot leak: a wait ends either by
      admission or by the configured timeout, and the release handle is idempotent, so
      there is no third path in which a waiter is stranded. Planning measured that
      writeHead and end after res.destroy() neither throw synchronously nor crash the
      server, so the rejection path is safe to build now; the behavior worth having
      (not charging a departed client for capacity, not holding sockets through
      shutdown) is the part that waits for #16.
  - decision: The count gate carries a pre-story floor so a no-test implementation cannot pass it
    rationale: >-
      Decided 2026-10-02, for e04s02 task 8. A gate that only checks the docs agree with
      each other is green on an untouched tree: the count is 100 before the story and 100
      after an implementer adds no tests, so every doc still agrees and the row goes
      green for work that did not happen. The gate therefore fails when the suite is not
      above the pre-story floor of 100. This was found by running all eight verifies
      against the unbuilt tree rather than by reasoning about them: task 8 was the one
