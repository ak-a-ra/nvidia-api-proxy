      caught only by running them: one demanded README name PROXY_RPM and
      PROXY_MODEL_LIMITS_JSON, which it never did, and one demanded SCOPE_LATEST name
      the ceiling, which it never did either, its stale claim living in the
      accepted-tradeoffs paragraph. The check is negative-tested both ways: green on a
      simulated fixed tree, six specific findings on the real tree. A gate that has
      only ever been seen failing has not been shown to pass, and one that has only
      ever passed has not been shown to fail.
  - decision: Test hermeticity is owned by the test harness, not by config.js
    rationale: >-
      Decided 2026-10-01, for e04s01 task 11. server.test.js spread process.env into
      every spawned child, so an operator's shell decided the outcome: an exported
      PROXY_SAFETY_MARGIN_PCT=51 left 15 of 78 passing, an exported PROXY_RPM=5 left
