  - decision: PROXY_LOG_REQUESTS is a closed vocabulary, and anything outside it is fatal
    rationale: >-
      Decided 2026-10-01, for e03s01 task 1, against the story's section 9 wording
      ("any non-blank non-0/false value enables logging"). The brief for this slice
      directed the strict reading and the story loses, which is the recorded deviation.
      1/true/yes/on enable and 0/false/no/off disable, case-insensitively and trimmed;
      unset or blank is off. Everything else exits 1 with one stderr line naming the
      variable, its rule, and the offending value bounded at 60 characters. The
      story's rule makes PROXY_LOG_REQUESTS=maybe switch a feature on with no signal
      that a typo was reinterpreted, and that is the quiet failure ADR 0002 exists to
      prevent, in the same family as Number("1e3") being 1000 for a rate limit. Fatal
      rather than lenient even though a boolean is the weakest case for strictness: the
      failure shape is identical (a value the operator wrote and the proxy did not
      honor, noticed by nobody), and the variable is new, so this fatal path cannot
      break a deployment that predates it. Leniency for this variable would also be
      the second parsing dialect in the file after readSeconds, and the first that
      silently accepts an operator's text. Reversal is one regex pair plus the tests
      that pin them.
  - decision: A log line records the last status written to the client, and 0 when none reached it
    rationale: >-
      Decided 2026-10-01, for e03s01 task 2. The line is written on the response's
      close event, which fires for every response including the destroyed ones, so the
      status has a rule for the cases where there is no finished response to report.
      The status is the last one written to the client, which is what the client
      actually saw: a streamed response cut by an upstream failure logs the 200 whose
      headers arrived, not a synthetic 5xx that describes the proxy rather than the
      exchange. A response destroyed before any status was written - a client
      disconnect before upstream headers - logs 0. A number, not a string, so the field
      type stays stable, and explicitly not a code the client never saw: Node's
      res.statusCode defaults to 200 even when nothing was written, so recording it
      unconditionally would invent a 200 for a client that received no response at all.
      "-" was rejected for the same reason a string would be: one field with two types.
      The 0 is a documented sentinel, not a value a status can take.
  - decision: Task 7's count gate stops calling the e01 script that never landed
    rationale: >-
      Decided 2026-10-01, for e03s01 task 7. The ledger's verify read "npm test &&
      node scripts/check-test-count.mjs", but scripts/ does not exist in this
      repository: the script belongs to e01s01, which never landed, so the command
      cannot pass as written and flipping the row on it would record a gate that is
      red. e04s01 task 12 already made this exact replacement with an inline gate that
      derives N from npm test and fails on any living doc stating a different number,
      and it was negative-tested then; e03s01 adopts the same command rather than
      inventing a third form of the same check. The replacement was run, not
      assumed: exit 0 and "count ok: 99 across the living docs". The count itself is
      unchanged by this decision, so no doc count moved because of it.
