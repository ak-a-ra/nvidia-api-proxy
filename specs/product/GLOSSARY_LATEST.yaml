# GLOSSARY_LATEST

```yaml
terms:
  Reverse Proxy:
    definition: "A proxy that forwards client requests to an upstream server and returns responses to clients."
    related: [Proxy, Upstream]
  
  NVIDIA NIM API:
    definition: "NVIDIA's cloud API for running and managing foundation models."
    related: [Upstream, Base URL]
  
  Base URL:
    definition: "Upstream anchor URL. Every proxied path is appended onto it; any API-version segment it carries is ignored during mapping."
    related: [Upstream, Path mapping]
  
  Proxy Token:
    definition: "Client-facing credential. The sole authentication for proxied calls; compared in constant time."
    related: [API key, Credential swap]
  
  API Key:
    definition: "Real NVIDIA credential. Lives server-side only; inserted into the upstream request's authorization header."
    related: [Proxy Token, Credential swap]
  
  Credential Swap:
    definition: "Replacing the client's bearer credential with the API key on the upstream request. The client's own credential never reaches upstream."
    related: [Proxy Token, API key]
  
  Unconfigured:
    definition: "Proxy is running but the API key or proxy token is missing (whitespace counts as missing). Degrades to a 'not configured' status response; never crashes."
    related: [Health]
  
  Health:
    definition: "Self-report distinguishing healthy from unconfigured. The only endpoint that needs no authentication."
    related: [Unconfigured]
  
  Pass-through:
    definition: "Upstream response forwarded byte-for-byte with headers preserved per fidelity rules. The normal case for successful calls."
    related: [Local response]
  
  Local Response:
    definition: "Status and body generated by the proxy itself: unauthenticated, unknown path, unconfigured, upstream failure. Never includes upstream details such as hostnames or URLs."
    related: [Pass-through]
  
  Path Mapping:
    definition: "Forwarding rule: the client's `/v1/...` path and query are appended verbatim to the base URL. A bare version prefix with no resource is an unknown path."
    related: [Base URL]
  
  Header Fidelity:
    definition: "Principle that headers arrive at each hop as the sender intended: multi-value headers stay multi-value, hop-by-hop headers are stripped both ways, and body length is preserved wherever the body is untouched."
    related: [Pass-through, set-cookie]
  
  Response Stream:
    definition: "Unbuffered upstream body flowing chunk-by-chunk to the client. Active streams are never cut; silence is bounded."
    related: [Client disconnect]
  
  Client Disconnect:
    definition: "When the downstream `res` closes (client aborted/disconnected), the per-request `AbortController` aborts the upstream fetch; a client-disconnect `AbortError` is swallowed in the catch block without sending a 502."
    related: [Response Stream]
```