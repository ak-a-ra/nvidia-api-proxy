  - id: 8
    description: >
      Full suite green with the default export still the only test seam, then sync the new total
      into every living doc that states a count. The verify below asserts the assertion rather
      than trusting it. It runs npm test once, derives N from the summary line, and fails if N is
      not above the pre-story floor of 100 — without that guard this task would go green for an
      implementer who added no tests at all and simply left every count untouched. It then
      requires the README badge to read tests-N%20passing, and fails if any doc outside plans/,
      docs/research/, .superpowers/, LOG.md, specs/epics/*/briefs/, and
      specs/epics/*/*-tasks.yaml states a different number. The dated agent archives under
      .superpowers/sdd/ hold per-run counts and are excluded for the same reason plans/ is.
      Task ledgers are excluded because e01s01 carries a deliberately wrong count as a CI
      fixture, which is not a statement about the suite. Briefs and LOG.md are append-only dated
      records and are never rewritten; this story spec is none of the three and stays in scope.
      It carries the word tests in its own prose, so the scan must skip this ledger file, which
      the exclusion handles. The scan cannot see state.yaml, because that file states the floor
      as bare numbers ("green at 100", "floor of 100") rather than as a count phrase, so task 8
      names the handoff note explicitly and the implementer updates it by hand: AGENTS.md lists
      the specs/state.yaml handoff note as a site to keep current. The two dated decision
      rationales that also say 100 are history and must not be rewritten; only the handoff note
      is a live claim.
    verify: "node -e \"const r = require(\\\"child_process\\\").spawnSync(\\\"npm\\\", [\\\"test\\\"], { encoding: \\\"utf8\\\", maxBuffer: 268435456 });\nconst out = (r.stdout || \\\"\\\") + (r.stderr || \\\"\\\");\nif (r.status !== 0) {\n  process.stdout.write(out.slice(-4000));\n  console.error(\\\"npm test failed\\\");\n  process.exit(1);\n}\nconst FLOOR = 100;\nconst line = out.split(\\\"\\\\n\\\").find((l) => /tests\\\\s+[0-9]+/.test(l));\nif (!line) {\n  console.error(\\\"no test count in npm test output\\\");\n  process.exit(1);\n}\nconst n = Number((line.match(/tests\\\\s+([0-9]+)/) || [])[1]);\nif (!Number.isInteger(n) || n < 1) {\n  console.error(\\\"could not derive a test count, got \\\" + line.trim());\n  process.exit(1);\n}\nif (n <= FLOOR) {\n  console.error(\\\"suite is still at the pre-story floor of \\\" + FLOOR + \\\" tests: no black-box test was added, and syncing the docs to an unchanged count would hide that\\\");\n  process.exit(1);\n}\nconst fs = require(\\\"fs\\\");\nconst badge = \\\"tests-\\\" + n + \\\"%20passing\\\";\nif (!fs.readFileSync(\\\"README.md\\\", \\\"utf8\\\").includes(badge)) {\n  console.error(\\\"README badge is not \\\" + badge);\n  process.exit(1);\n}\nconst SKIP = /^\\\\.\\\\/?(plans\\\\/|docs\\\\/research\\\\/|\\\\.superpowers\\\\/|LOG\\\\.md|specs\\\\/epics\\\\/.*\\\\/briefs\\\\/|specs\\\\/epics\\\\/.*-tasks\\\\.yaml)/;\nconst COUNT = /tests(-| )?[0-9]{2,4}|[0-9]{2,4}[ -]?tests?/;\nconst MENTION = new RegExp(\\\"(tests(-| )?\\\" + n + \\\"|[^0-9]\\\" + n + \\\"[ -]?tests?)\\\");\nconst bad = [];\nconst walk = (d) => {\n  for (const e of fs.readdirSync(d, { withFileTypes: true })) {\n    if (e.name === \\\"node_modules\\\" || e.name === \\\".git\\\") continue;\n    const p = d + \\\"/\\\" + e.name;\n    if (e.isDirectory()) {\n      walk(p);\n      continue;\n    }\n    const isDoc = e.name.endsWith(\\\".md\\\") || e.name.endsWith(\\\".yaml\\\");\n    if (!isDoc) continue;\n    if (SKIP.test(p)) continue;\n    fs.readFileSync(p, \\\"utf8\\\")\n      .split(\\\"\\\\n\\\")\n      .forEach((l, i) => {\n        if (COUNT.test(l) && !MENTION.test(l)) bad.push(p + \\\":\\\" + (i + 1) + \\\": \\\" + l.trim().slice(0, 90));\n      });\n  }\n};\nwalk(\\\".\\\");\nif (bad.length) {\n  console.error(\\\"stale test counts:\\\\n\\\" + bad.join(\\\"\\\\n\\\"));\n  process.exit(1);\n}\nconsole.log(\\\"count ok: \\\" + n + \\\" tests across the living docs\\\");\""
    risk: P1
    security: none
    status: failing
    allure:
      severity: high
      categories:
        - "Regression"
        - "Documentation"
