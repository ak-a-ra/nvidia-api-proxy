context: infra
tasks:
  - id: 1
    description: >
      Add a root-level admission.js that owns all admission state behind one narrow interface:
      construct it from config.limits, acquire() returns either an immediate admission, a
      pending ticket resolved later, or a rejection, and release() frees a slot and wakes the
      oldest waiter. Three invariants live inside this module and nowhere else: the active
      count never exceeds the ceiling, release is idempotent per admission (a settled flag, not
      a call count), and a ticket whose wait timed out is never admitted afterwards. When
      config.limits.maxConcurrentRequests is null the module admits everything immediately,
      allocates no queue, and starts no timer, so the request path is today's path.
      This story adds no environment variable, so CONFIG_ENV_VARS in server.test.js needs no
      entry; do not add one. server.js must not re-export limiter internals (issue #13 story
      138) and no second test seam may appear (story 139), so admission.js stays tested
      through the existing black-box child-process harness.
    verify: "npm test && node -e \"const s=require('fs').readFileSync('admission.js','utf8'); if(!/maxConcurrentRequests/.test(s)){console.error('admission.js does not read the configured ceiling');process.exit(1);} const v=require('fs').readFileSync('server.js','utf8'); if(/export\\s*{[^}]*\\b(createAdmission|admission|acquire)\\b/.test(v)){console.error('server.js must not re-export limiter internals');process.exit(1);} if(/setInterval/.test(s)){console.error('admission must be event-driven, never polled');process.exit(1);} console.log('no new security findings in affected paths: no new export, no polling');\""
    risk: P0
    security: low
    status: failing
    allure:
      severity: critical
      categories:
        - "Admission"
        - "Refactor"
  - id: 2
    description: >
      Wire the gate into server.js after the unconfigured check and before the upstream
      request is built, so a queued or rejected request never contacts the upstream. Add black-box
      tests for: the ceiling absent, blank, and "0" admitting every concurrent request with no
      wait and no rejection; a positive ceiling admitting up to that many and making the rest
      wait; and a full queue answering 429 with body exactly {"error":"Too many requests"}, a
      positive Retry-After, and zero upstream requests for the rejected one. The stub upstream
      needs a mode that holds a response open so a ceiling can be observed; add it additively and
      leave every existing mode untouched. Both rejection reasons must share one sendJson path so
      the request stays drained and the keep-alive connection survives the early rejection.
      Tests must drive ordering through the stub's recorded arrival, never by sleeping and hoping.
    verify: "out=$(node --test --test-reporter=tap --test-name-pattern 'concurrency ceiling|full queue' server.test.js 2>&1); rc=$?; test $rc -eq 0 && t=$(printf '%s\\n' \"$out\" | grep -cE '^[[:space:]]*ok [0-9]+ - .*(concurrency ceiling|full queue)') && test \"$t\" -ge 3 && node -e \"const s=require('fs').readFileSync('server.js','utf8'); if(!/retry-after|Retry-After/i.test(s)){console.error('429 must carry Retry-After');process.exit(1);} if(!/Too many requests/.test(s)){console.error('rejection body missing');process.exit(1);} console.log('no new security findings in affected paths: rejection body is a fixed string');\""
    risk: P0
    security: high
    status: failing
    allure:
      severity: critical
      categories:
        - "Admission"
        - "Config"
        - "Security Review"
  - id: 3
    description: >
      Prove the queue is strict FIFO and that an arriving request cannot overtake an older
      waiter. With a one-slot ceiling, drive three requests in a known arrival order while the
      single slot is busy and assert the upstream recorded those same three bodies in that same
      order. Also pin the no-bypass rule directly: while one request waits, a request that arrives
      afterwards with the slot already free must still wait behind it. The wait must be resolved
      by the release that frees capacity, never by a timer that polls, and no test may assert an
      ordering the stub did not record.
    verify: "out=$(node --test --test-reporter=tap --test-name-pattern 'FIFO' server.test.js 2>&1); rc=$?; test $rc -eq 0 && t=$(printf '%s\\n' \"$out\" | grep -cE '^[[:space:]]*ok [0-9]+ - .*FIFO') && test \"$t\" -ge 1 && node -e \"const s=require('fs').readFileSync('admission.js','utf8'); if(/setInterval|while\\s*\\(\\s*true/.test(s)){console.error('queue wait must be event-driven');process.exit(1);} console.log('no new security findings in affected paths: FIFO order does not leak caller data');\""
    risk: P0
    security: low
    status: failing
    allure:
      severity: critical
      categories:
        - "Admission"
  - id: 4
    description: >
      Prove capacity is released exactly once on every terminal path, each through the one shared
      cleanup path: normal completion, a no-body response, an upstream error status passed
      through, a pre-header upstream failure, and a mid-stream upstream failure. For each, run the
      failing or finishing request first under a one-slot ceiling, then assert the next request is
      admitted rather than queued forever, which is what a leaked slot looks like. A double
      release is the opposite failure and inflates capacity past the configured ceiling: cover it
      by asserting that after the terminal path the still-busy slot does not admit a second
      request. This task is where the queue-timeout rejection is added, so a wait that expires
      answers 429 with the same fixed body and a Retry-After carrying the configured wait.
    verify: "out=$(node --test --test-reporter=tap --test-name-pattern 'slot release|queue timeout|terminal' server.test.js 2>&1); rc=$?; test $rc -eq 0 && t=$(printf '%s\\n' \"$out\" | grep -cE '^[[:space:]]*ok [0-9]+ - .*(slot release|queue timeout|terminal)') && test \"$t\" -ge 4 && npm test"
    risk: P0
    security: medium
    status: failing
    allure:
      severity: critical
      categories:
        - "Admission"
        - "Streaming"
        - "Security Review"
  - id: 5
    description: >
      Prove the two properties that are easy to regress silently. First, /health bypasses
      admission: with a one-slot ceiling, one request streaming, and the queue full, /health must
      still answer 200 with its existing body. Second, the 429 leaks nothing: assert the response
      body is exactly the fixed string and that it names no model, path, queue depth, budget
      value, or upstream host. Extend the same assertion to prove enabling the ceiling changes no
      pass-through behavior once a request is admitted: path mapping, query forwarding, credential
      swap, header fidelity, byte-identical request body, and SSE streaming all behave as they do
      with the ceiling disabled.
    verify: "out=$(node --test --test-reporter=tap --test-name-pattern 'health bypass|leak|429 body' server.test.js 2>&1); rc=$?; test $rc -eq 0 && t=$(printf '%s\\n' \"$out\" | grep -cE '^[[:space:]]*ok [0-9]+ - .*(health bypass|leak|429 body)') && test \"$t\" -ge 2 && node -e \"const s=require('fs').readFileSync('server.js','utf8'); if(/health[\\s\\S]{0,400}acquire/.test(s)){console.error('/health must not pass through admission');process.exit(1);} console.log('no new security findings in affected paths: overload response is inert');\""
    risk: P0
    security: high
    status: failing
    allure:
      severity: critical
      categories:
        - "Admission"
        - "Security Review"
        - "Streaming"
  - id: 6
    description: >
      Correct the one existing test whose title this story falsifies:
      "PROXY_MAX_CONCURRENT_REQUESTS=1 over a one-slot queue still proxies normally (values
      validated, not applied)". Its assertion stays verbatim, because a single request under a
      one-slot ceiling still proxies normally, but the title must no longer claim the ceiling
      changes no traffic. ADR 0002 records that a later enforcing slice has to change this test
      deliberately, and that is this change. Rename it so it states the surviving claim: a single
