tasks:
  - id: 1
    description: >
      Extend admission.js so a queued ticket can be cancelled by its request signal. Cancellation
      must remove that exact waiter from the FIFO queue, clear its timeout, remove its abort
      listener, and settle it once without consuming a slot. Resolve timer-versus-release races
      with one settled transition so a ticket cannot be both rejected and admitted. Add black-box
      coverage through server.test.js for queued disconnect, timer-mid-release, repeated
      cancellation/release transitions, and proof that a cancelled waiter never reaches upstream.
      Keep admission ownership in admission.js and add no test seam or runtime dependency.
    verify: >-
      out=$(node --test --test-reporter=tap --test-name-pattern 'queued disconnect removes waiter|timer-release race settles ticket once|repeated cancellation/release transitions' server.test.js 2>&1); rc=$?; test "$rc" -eq 0 || { printf '%s\n' "$out"; exit "$rc"; }; count=$(printf '%s\n' "$out" | grep -cE '^[[:space:]]*ok [0-9]+ - '); test "$count" -ge 3 && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - queued disconnect removes waiter' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - timer-release race settles ticket once' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - repeated cancellation/release transitions'
    risk: P0
    security: medium
    status: failing
    allure:
      severity: critical
      categories:
        - "Admission"
        - "Cancellation"
        - "Race Condition"
  - id: 2
    description: >
      Connect downstream disconnect handling to admission and active upstream work. A client
      disconnect while queued must cancel its ticket; after admission, disconnect before upstream
      headers or during response streaming must abort the upstream fetch/stream and release the
      slot exactly once. Preserve the existing AbortError handling and clean 502 behavior for
      genuine upstream failures. Add black-box tests for both disconnect phases, then prove a
      following request can use the released capacity and no abandoned request reaches upstream.
      Assert client disconnect AbortError handling emits no 502 response.
    verify: >-
      out=$(node --test --test-reporter=tap --test-name-pattern 'disconnect before headers aborts upstream and releases slot|disconnect during stream aborts upstream and releases slot|queued disconnect cancels waiter without upstream call|client disconnect abort is swallowed without 502 response' server.test.js 2>&1); rc=$?; test "$rc" -eq 0 || { printf '%s\n' "$out"; exit "$rc"; }; count=$(printf '%s\n' "$out" | grep -cE '^[[:space:]]*ok [0-9]+ - '); test "$count" -ge 4 && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - disconnect before headers aborts upstream and releases slot' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - disconnect during stream aborts upstream and releases slot' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - queued disconnect cancels waiter without upstream call' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - client disconnect abort is swallowed without 502 response'
    risk: P0
    security: medium
    status: failing
    allure:
      severity: critical
      categories:
        - "Admission"
        - "Streaming"
        - "Cancellation"
  - id: 3
    description: >
      Add an admission close transition and invoke it before graceful server shutdown. Closing
      admission rejects every queued request with status 503 and exact body {"error":"Service
      unavailable"}; it admits no later waiter and makes zero upstream calls for rejected queue
      entries. Keep already admitted streams alive under the existing 10-second SIGTERM grace,
      keep /health responsive during queue saturation and shutdown, and preserve successful child
      exit. Cover queued rejection, late arrivals, repeated close, and admitted stream completion
      through the existing child-process black-box harness.
    verify: >-
      out=$(node --test --test-reporter=tap --test-name-pattern 'SIGTERM rejects queued requests with 503 and no upstream call|shutdown rejects late arrivals and keeps health responsive|health stays responsive during shutdown queue saturation|admitted stream finishes during SIGTERM grace' server.test.js 2>&1); rc=$?; test "$rc" -eq 0 || { printf '%s\n' "$out"; exit "$rc"; }; count=$(printf '%s\n' "$out" | grep -cE '^[[:space:]]*ok [0-9]+ - '); test "$count" -ge 4 && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - SIGTERM rejects queued requests with 503 and no upstream call' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - shutdown rejects late arrivals and keeps health responsive' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - health stays responsive during shutdown queue saturation' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - admitted stream finishes during SIGTERM grace'
    risk: P0
    security: medium
    status: failing
    allure:
      severity: critical
      categories:
        - "Admission"
        - "Shutdown"
        - "Streaming"
  - id: 4
    description: >
      Harden and observe rejection behavior at disconnect and queue boundaries. Guard the 429
      response arm against writing after res.destroyed, and make sure a departed waiter cannot
      receive a late 429 or 503. Add deterministic black-box assertions for the default queue size
      of 32 and retain the fixed 250ms no-bypass observation window only where needed to prove a
      later arrival did not overtake an older waiter. Keep the exact existing 429 body and
      Retry-After contract; no response may expose queue or upstream details.
    verify: >-
      out=$(node --test --test-reporter=tap --test-name-pattern 'default queue size is 32|destroyed response skips late 429|fixed 250ms observation proves no bypass|full queue keeps exact 429 contract' server.test.js 2>&1); rc=$?; test "$rc" -eq 0 || { printf '%s\n' "$out"; exit "$rc"; }; count=$(printf '%s\n' "$out" | grep -cE '^[[:space:]]*ok [0-9]+ - '); test "$count" -ge 4 && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - default queue size is 32' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - destroyed response skips late 429' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - fixed 250ms observation proves no bypass' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - full queue keeps exact 429 contract'
    risk: P1
    security: high
    status: failing
    allure:
      severity: high
      categories:
        - "Admission"
        - "Security Review"
        - "Regression"
  - id: 5
    description: >
      Update living documentation and test-count references for the added black-box cases. Keep
      the configuration table current, record the abort/shutdown behavior and fail-fast/degrade
      implications in the appropriate ADR and architecture docs, and update README, conventions,
      state handoff, and every other living count site found by the repository's documented count
      sweep. Preserve historical briefs, plans, and research notes as dated records. Prove the
      count synchronization against the actual suite summary and fail if any living doc disagrees.
    verify: >-
      node -e 'const cp=require("node:child_process"),fs=require("node:fs");const r=cp.spawnSync("npm",["test"],{encoding:"utf8",maxBuffer:268435456});const out=(r.stdout||"")+(r.stderr||"");if(r.status!==0){process.stdout.write(out.slice(-4000));process.exit(r.status||1)}const m=out.match(/tests\s+(\d+)/);if(!m)throw Error("npm test output has no test count");const n=m[1];if(!fs.readFileSync("README.md","utf8").includes("tests-"+n+"%20passing"))throw Error("README test badge does not match suite count "+n);const skip=/^(plans\/|docs\/research\/|\.superpowers\/|LOG\.md|specs\/epics\/.*\/briefs\/|specs\/epics\/.*-tasks\.yaml)/;const count=/tests(-| )?[0-9]{2,4}|[0-9]{2,4}[ -]?tests?|\(currently [0-9]{2,4}\)/;const mention=new RegExp("(tests(-| )?"+n+"|[^0-9]"+n+"[ -]?tests?|\\(currently\\s+"+n+"\\))");const bad=[];function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){if(e.name==="node_modules"||e.name===".git")continue;const p=d+"/"+e.name;if(e.isDirectory()){walk(p);continue}if(!/\.(md|yaml)$/.test(e.name)||skip.test(p))continue;fs.readFileSync(p,"utf8").split("\n").forEach((line,i)=>{if(count.test(line)&&!mention.test(line))bad.push(p+":"+(i+1)+": "+line.trim().slice(0,90))})}}walk(".");if(bad.length)throw Error("stale test counts:\n"+bad.join("\n"));console.log("README badge and living-doc test counts match "+n)' && git diff --check
    risk: P1
    security: none
    status: failing
