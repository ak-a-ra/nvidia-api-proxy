  - id: 5
    description: >
      Run the full suite once, derive N from the "# tests N" TAP summary line, and fail
      if any living doc outside plans/, docs/research/config-invariant-guard-tests.md,
      LOG.md, specs/epics/*/briefs/, and specs/epics/*/*-tasks.yaml states a different
      number. Sweep uses the AGENTS.md grep pattern plus the stale-number sweep.
    verify: |-
      out=$(node --test --test-reporter=tap server.test.js 2>&1); rc=$?
      test "$rc" -eq 0 || { printf '%s\n' "$out"; exit "$rc"; }
      N=$(printf '%s\n' "$out" | grep -E '^# tests [0-9]+$' | grep -oE '[0-9]+')
      test -n "$N" || { echo 'no test count line'; exit 1; }
      hits=$(grep -rnE '(^|[^A-Za-z0-9])[0-9]{2,4}[ -]tests?\b|tests-[0-9]{2,4}|\(currently [0-9]+\)' --include='*.md' --include='*.yaml' . | grep -v '^\./plans/' | grep -v 'docs/research/config-invariant-guard-tests' | grep -v '/briefs/' | grep -v '^\./LOG.md' | grep -v '/specs/verifications/' | grep -v -- '-tasks.yaml')
      bad=$(printf '%s\n' "$hits" | grep -vE "(^|[^A-Za-z0-9])${N}[ -]tests?\b|tests-${N}\b|\(currently ${N}\)")
      test -z "$bad" || { printf 'stale test count (suite is %s):\n%s\n' "$N" "$bad"; exit 1; }
    risk: P0
    security: none
    status: failing
    allure:
      severity: critical
      categories:
