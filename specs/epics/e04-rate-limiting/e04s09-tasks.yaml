  - id: 7
    description: >
      Black-box manual smoke against a local proxy with rate limiting enabled: Health
      returns 200, one proxied request returns 200, a saturated Queue returns 429, SSE
      pass-through is byte-identical, authenticated /stats returns 200 with the 21-key
      allowlist. Starts its own proxy + stub upstream; exits non-zero on any failure.
    verify: |-
      set -e
      PORT=19090 NVIDIA_BASE_URL=http://127.0.0.1:19091 NVIDIA_API_KEY=smoke-key PROXY_AUTH_TOKEN=smoke-tok \
        PROXY_RPM=1000 PROXY_TPM=1000000 PROXY_MAX_CONCURRENT_REQUESTS=1 PROXY_MAX_QUEUE_SIZE=1 \
        PROXY_QUEUE_TIMEOUT_SECONDS=2 node server.js > /tmp/e04s09-proxy.log 2>&1 &
      PROXY_PID=$!
      ( node -e '
        import http from "node:http";
        const s = http.createServer((req, res) => {
          setTimeout(() => { res.writeHead(200, { "content-type": "application/json" }); res.end(JSON.stringify({ ok: true })); }, 1500);
        });
        s.listen(19091);
      ' ) > /tmp/e04s09-stub.log 2>&1 &
      STUB_PID=$!
      for i in $(seq 1 50); do
        curl -sf http://127.0.0.1:19090/health >/dev/null 2>&1 && break
        sleep 0.2
      done
      curl -sf http://127.0.0.1:19090/health | grep -q '"status":"ok"' || { echo 'health failed'; exit 1; }
      # hold the single concurrency slot with a slow request
      curl -s -H 'Authorization: Bearer smoke-tok' \
        -H 'Content-Type: application/json' -d '{"model":"m","messages":[{"role":"user","content":"hi"}]}' \
        http://127.0.0.1:19090/v1/chat/completions > /dev/null 2>&1 &
      REQ1_PID=$!
      sleep 0.3
      # second request waits in the queue (queue size 1)
      code2=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer smoke-tok' \
        -H 'Content-Type: application/json' -d '{"model":"m","messages":[{"role":"user","content":"hi"}]}' \
        http://127.0.0.1:19090/v1/chat/completions)
      test "$code2" = "200" || { echo "queued request expected 200 after wait got $code2"; exit 1; }
      # third request: queue full -> 429
      code3=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer smoke-tok' \
        -H 'Content-Type: application/json' -d '{"model":"m","messages":[{"role":"user","content":"hi"}]}' \
        http://127.0.0.1:19090/v1/chat/completions)
      test "$code3" = "429" || { echo "saturation expected 429 got $code3"; exit 1; }
      wait $REQ1_PID 2>/dev/null || true
      code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer smoke-tok' \
        http://127.0.0.1:19090/stats)
      test "$code" = "200" || { echo "/stats returned $code"; exit 1; }
      curl -s -H 'Authorization: Bearer smoke-tok' http://127.0.0.1:19090/stats \
        | grep -q '"completed":' || { echo '/stats missing completed key'; exit 1; }
      kill $PROXY_PID $STUB_PID 2>/dev/null || true
      echo 'e04s09 smoke ok'
    risk: P0
    security: none
    status: failing
    allure:
      severity: critical
      categories:
        - "Manual Smoke"
        - "Black Box"
