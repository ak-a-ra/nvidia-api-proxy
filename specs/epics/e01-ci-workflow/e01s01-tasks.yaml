  - id: 2
    description: "Prove the checker detects drift by temporarily editing a living doc count, then confirm it exits 1 and restore the file"
    verify: "sed -i.bak 's/tests-[0-9]\\+%20passing/tests-99%20passing/' README.md; n=$(npm test 2>/dev/null | grep -E '^. tests ' | grep -oE '[0-9]+$'); grep -q \"tests-${n}%20passing\" README.md; rc=$?; mv README.md.bak README.md; test $rc -eq 1"
    risk: P1
    status: failing
    allure:
      severity: high
      categories:
        - "CI"
        - "Regression"
  - id: 3
    description: "Add .github/workflows/ci.yml running npm test on Node 18, 20, and 24 for push and pull_request, using only actions/checkout and actions/setup-node, with no install step (zero-dependency project)"
    verify: "test -f .github/workflows/ci.yml && node -e \"const s=require('fs').readFileSync('.github/workflows/ci.yml','utf8'); for (const v of ['18','20','24']) if (!s.includes(v)) { console.error('missing Node '+v+' matrix leg'); process.exit(1); } if (/npm (ci|install)/.test(s)) { console.error('install step present but project is zero-dep'); process.exit(1); } if (!/npm test/.test(s)) { console.error('npm test not invoked'); process.exit(1); }\""
    risk: P1
    status: failing
    allure:
      severity: high
      categories:
        - "CI"
        - "DX"
