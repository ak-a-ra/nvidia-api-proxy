    description: >
      Add scripts/check-test-count.mjs: run npm test, read the reported total from
      node --test output, grep the same pattern AGENTS.md documents, and exit 1
      naming file and both numbers on any mismatch. Exempt plans/,
      docs/research/, and the gitignored .claude/ .agents/ .superpowers/ trees.
