story_id: e01s01
title: Run the suite and test count sync on every push
status: done
bcps: 3
notes: >
  Corrected 2026-11-15 when the CI workflow was restored. Tasks 1, 2, 4 and 6 originally
  named `scripts/check-test-count.mjs`, which has never existed in this repository; the
  count gate that shipped is the inline sweep `AGENTS.md` documents, the same replacement
  e04s01 task 12 and e03s01 task 7 already made. Task 3's original Node 18 matrix leg is
  also superseded: e08s02 raised `engines.node` to ">=20", so the workflow tests 20, 22 and
  24 and no leg runs the old floor. The ledger records what landed.
tasks:
  - id: 1
    description: >
      Enforce the test-count sweep. No script is added: the gate derives N from the
      `# tests N` TAP summary line and fails if any hit outside plans/, docs/research/,
      LOG.md, specs/epics/*/briefs/, specs/epics/*/*-tasks.yaml, specs/epics/archive/,
      and specs/verifications/ states a different number. Those directories hold dated or
      append-only records, not living claims.
    verify: "npm test && n=$(npm test 2>/dev/null | grep -E '^. tests ' | grep -oE '[0-9]+$') && grep -q \"tests-${n}%20passing\" README.md && test -z \"$(grep -rnE 'tests(-| )?[0-9]{2,4}|[0-9]{2,4}[ -]?tests?' --include='*.md' --include='*.yaml' . | grep -vE '^\\./(plans/|docs/research/|LOG\\.md|specs/epics/.*/briefs/|specs/epics/.*-tasks\\.yaml|specs/epics/archive/|specs/verifications/|node_modules/)' | grep -vE \"tests(-| )?${n}|[^0-9]${n}[ -]?tests?\")\" && echo \"count ok: ${n} across the living docs\""
    risk: P1
    status: done
    allure:
      severity: high
      categories:
        - "CI"
        - "Documentation"
  - id: 2
    description: "Prove the gate detects drift by temporarily editing a living doc count, then confirm it exits 1 and restore the file"
    verify: "sed -i.bak 's/tests-[0-9]\\+%20passing/tests-99%20passing/' README.md; n=$(npm test 2>/dev/null | grep -E '^. tests ' | grep -oE '[0-9]+$'); grep -q \"tests-${n}%20passing\" README.md; rc=$?; mv README.md.bak README.md; test $rc -eq 1"
    risk: P1
    status: done
    allure:
      severity: high
      categories:
        - "CI"
        - "Regression"
  - id: 3
    description: "Add .github/workflows/ci.yml running npm test on Node 20, 22 and 24 for push to main and for pull_request, using only actions/checkout and actions/setup-node, with no install step on the test job (zero-dependency project). The Node 18 leg the original brief asked for is superseded: e08s02 raised engines.node to >=20."
    verify: "test -f .github/workflows/ci.yml && node -e \"const s=require('fs').readFileSync('.github/workflows/ci.yml','utf8'); for (const v of ['20','22','24']) if (!s.includes(v)) { console.error('missing Node '+v+' matrix leg'); process.exit(1); } if (!/npm test/.test(s)) { console.error('npm test not invoked'); process.exit(1); }\""
    risk: P1
    status: done
    allure:
      severity: high
      categories:
        - "CI"
        - "DX"
  - id: 4
    description: >
      Count-sync runs in the `quality` job alongside lint, typecheck and format, via the
      inline sweep from task 1 rather than a separate script: the job installs dev tooling,
      then runs lint, typecheck, format:check and scripts/check-state-yaml.py. The key
      negative-tests the ledger reader so a duplicate YAML key cannot pass unnoticed.
    verify: "grep -q 'check-state-yaml' .github/workflows/ci.yml && grep -q 'npm run format:check' .github/workflows/ci.yml"
    risk: P2
    status: done
    allure:
      severity: normal
      categories:
        - "CI"
  - id: 5
    description: "Replace AGENTS.md's 'No CI: tests only run when run locally' claim with the CI workflow, and note the new scripts/ directory in File Organization"
    verify: "! grep -q 'No CI: tests only run when run locally' AGENTS.md && grep -q 'ci.yml' AGENTS.md"
    risk: P2
    status: done
    allure:
      severity: normal
      categories:
        - "Documentation"
  - id: 6
    description: "Full suite still green and the count gate passes on the unmodified tree"
    verify: "npm test && echo 'count gate: see task 1'"
    risk: P1
    status: done
    allure:
      severity: high
      categories:
        - "CI"
        - "Regression"
