story_id: e04s04
title: Enforce global RPM/TPM budgets with Safety margin
status: passing
bcps: 9
issue: 17
type: feat
risk: P0
context: infra
tasks:
  - id: 1
    description: >
      Add the root module budget.js: one rolling 60-second window pair, the Safety margin
      effective-limit arithmetic floored at one, the cost estimator (messages, tools, requested
      output default 1024 capped 4096) with a four-characters-per-token fallback for encoded,
      malformed, non-JSON, unknown-model and no-model bodies, and a reserve/reserve-again
      interface whose rejection carries a Retry-After derived from the window's oldest live
      reservation. The module reads no environment, owns no default, and runs no timer; a null
      rate pair builds a gate that fails open and allocates nothing. Cover it through server.test.js
      with a new describe block plus additions to the existing stub modes, and add no test seam.
    verify: >-
      out=$(node --test --test-reporter=tap --test-name-pattern 'e04s04' server.test.js 2>&1); rc=$?; test "$rc" -eq 0 || { printf '%s\n' "$out"; exit "$rc"; }; count=$(printf '%s\n' "$out" | grep -cE '^[[:space:]]*ok [0-9]+ - '); test "$count" -ge 8 && printf '%s\n' "$out" | grep -qE '^# pass 8'
    risk: P0
    security: low
    status: passing
    allure:
      severity: critical
      categories:
        - "Rate Limiting"
        - "Estimation"
        - "Rolling Window"
  - id: 2
    description: >
      Wire the rate gate into server.js between the configured check and admission, active only
      when config.rateLimit is non-null: buffer the request body up to PROXY_MAX_BUFFERED_BODY_BYTES
      (413 exact body on overflow, silent return when the client is gone), estimate the cost,
      reserve against the window, and answer 429 with an exact generic body and a positive
      Retry-After when the reservation fails. Forward the original buffer byte-identically with
      the caller's headers intact, restoring content-length so undici does not reframe the request
      as chunked, and leave the disabled mode's fully streaming no-buffer path unchanged. Close the
      budget on SIGTERM beside admission so a request in flight during drain is not charged against
      a window nothing reads again.
    verify: >-
      out=$(node --test --test-reporter=tap --test-name-pattern 'byte-identical forwarding|a body above the cap|over budget is answered immediately|absent rate pair keeps the streaming path' server.test.js 2>&1); rc=$?; test "$rc" -eq 0 || { printf '%s\n' "$out"; exit "$rc"; }; printf '%s\n' "$out" | grep -qE '^# pass 4' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - a body above the cap' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - byte-identical forwarding' && printf '%s\n' "$out" | grep -qE '^[[:space:]]*ok [0-9]+ - over budget is answered immediately'
    risk: P0
    security: medium
    status: passing
    allure:
      severity: critical
      categories:
        - "Rate Limiting"
        - "Request Path"
        - "Security Review"
