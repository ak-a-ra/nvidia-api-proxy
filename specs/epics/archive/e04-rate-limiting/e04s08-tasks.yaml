tasks:
  - id: 1
    description: >
      Add monotonic counters to admission.js on both paths: the disabled path
      returns zero-valued read-only getters, and the enabled path exposes
      active, queued, admitted, waits, queueFullRejections,
      queueTimeoutRejections, and queuedClientDisconnects. Increment admitted
      exactly once per admitted ticket, waits once per ticket that enters the
      queue, queued once per queued ticket, queueFullRejections once per
      full-queue rejection, queueTimeoutRejections once per timed-out ticket,
      and queuedClientDisconnects once per ticket settled CANCELLED while
      queued. No counter is reset; all are read-only getters. Verify with
      direct import of admission.js.
    verify: >-
      node --input-type=module -e "
        import { createAdmission } from './admission.js';
        import assert from 'node:assert/strict';
        const disabled = createAdmission({ maxConcurrentRequests: null, maxQueueSize: 32, queueTimeoutSeconds: 30 });
        assert.equal(disabled.active, 0);
        assert.equal(disabled.queued, 0);
        assert.equal(disabled.admitted, 0);
        const full = createAdmission({ maxConcurrentRequests: 1, maxQueueSize: 0, queueTimeoutSeconds: 1 });
        const t1 = await full.acquire(null);
        assert.equal(t1.admitted, true);
        const t2 = await full.acquire(null);
        assert.equal(t2.admitted, false);
        assert.equal(full.queueFullRejections, 1);
        const timing = createAdmission({ maxConcurrentRequests: 1, maxQueueSize: 1, queueTimeoutSeconds: 1 });
        const u1 = await timing.acquire(null);
        const u2promise = timing.acquire(null);
        await new Promise(r => setTimeout(r, 1200));
        const u2 = await u2promise;
        assert.equal(u1.admitted, true);
        assert.equal(u2.admitted, false);
        assert.equal(timing.queueTimeoutRejections, 1);
        assert.equal(timing.waits, 1);
        assert.equal(typeof timing.active, 'number');
        assert.equal(typeof timing.queued, 'number');
        assert.equal(typeof timing.admitted, 'number');
        assert.equal(typeof timing.queuedClientDisconnects, 'number');
        console.log('admission counters shape ok');
      " 2>&1 | grep -q 'admission counters shape ok'
    risk: P0
    security: low
    status: passing
    allure:
      severity: critical
      categories:
        - "Rate Limiting"
        - "Admission"

  - id: 2
    description: >
      Add monotonic counters to budget.js: expose reconciledCount as usageReconciled
      and fallbackCount as usageEstimateFallbacks (aliases preserving the existing
      getters), add costOverLimitRejections (incremented once per reserve rejected
      by the global or model window) and trackedModels (distinct model IDs seen in
      cost.model, recorded by reserve() and stored in a null-prototype map so a
      "__proto__" model ID is an ordinary key). estimateCost stays pure; the
      disabled gate returns zero counters. Verify via direct import of budget.js.
    verify: >-
      node --input-type=module -e "
        import { createBudget, estimateCost } from './budget.js';
        import assert from 'node:assert/strict';
        const disabled = createBudget(null, { safetyMarginPct: 5 }, null);
        assert.equal(disabled.costOverLimitRejections, 0);
        assert.equal(disabled.trackedModels, 0);
        const b = createBudget({ rpm: 60, tpm: 2000 }, { safetyMarginPct: 0 }, null);
        const c1 = estimateCost({ model: 'm', messages: [{ role: 'user', content: 'hi' }] }, Buffer.from('{}'));
        const r1 = b.reserve(c1);
        assert.equal(r1.admitted, true);
        const c2 = estimateCost({ model: 'm' }, Buffer.from('x'.repeat(200000)));
        const r2 = b.reserve(c2);
        assert.equal(r2.admitted, false);
        assert.equal(b.costOverLimitRejections, 1);
        assert.equal(b.trackedModels, 1);
        assert.equal(b.usageReconciled, 0);
        assert.equal(b.usageEstimateFallbacks, 0);
        console.log('budget counters shape ok');
      " 2>&1 | grep -q 'budget counters shape ok'
    risk: P0
    security: low
    status: passing
    allure:
      severity: critical
      categories:
        - "Rate Limiting"
        - "Estimation"

  - id: 3
    description: >
      Add monotonic counters to server.js: completed (every terminal proxied
      outcome), oversizedBodyRejections (the 413 arm in readBodyWithCap), and
      activeClientDisconnects (the swallowed AbortError "client disconnected" on
      an admitted request). Wire each into the existing sendJson/return/catch
      paths so exactly one increment lands per terminal event. Verify with a
      source-presence check.
    verify: >-
      node -e "
        const fs = require('fs');
        const s = fs.readFileSync('server.js', 'utf8');
        if (!/completed/.test(s) || !/oversizedBodyRejections/.test(s) || !/activeClientDisconnects/.test(s)) {
          console.error('server.js missing one of the three stats counters'); process.exit(1);
        }
        console.log('server.js counters present');
      "
    risk: P1
    security: none
    status: passing
    allure:
      severity: high
      categories:
        - "Request Path"

  - id: 4
    description: >
      Wire the GET /stats route into server.js. Place the branch after the
      opt-in log listener and after /health, before the /v1/* path check and
      before admission.acquire. The branch: authorized() -> 401 { error: "Unauthorized" };
      config.unconfigured -> 503 { error: "Proxy is not configured" }; method
      !== GET -> 404 { error: "Not found" }; otherwise build the exact 24-key
      allowlist object from config.rateLimit, config.limits, and the counters,
      answer 200 with content-type application/json; charset=utf-8 and exact
      content-length via sendJson. /stats bypasses admission, budgets, and
      upstream; increments no counter (self-exclusion). Add black-box tests:
      "GET /stats returns 401 without a token", "GET /stats returns 401 with an
      invalid token", "GET /stats returns 503 while unconfigured with a valid
      token", "GET /stats returns 200 while saturated", "non-GET /stats returns
      404", "upstream receives zero requests for /stats", "exact allowlist field
      set", "disabled shape: rateLimitEnabled false, effective RPM/TPM null",
      "privacy exclusions", "self-exclusion: stats moves no counter".
    verify: >-
      out=$(node --test --test-reporter=tap --test-name-pattern 'GET /stats|stats' server.test.js 2>&1); rc=$?; test "$rc" -eq 0 || { printf '%s\n' "$out"; exit "$rc"; }; n=$(printf '%s\n' "$out" | grep -cE '^[[:space:]]*ok [0-9]+ - .*(GET /stats|stats)'); test "$n" -ge 10 || { printf 'expected at least 10 new stats tests, got %s\n' "$n"; exit 1; }
    risk: P0
    security: high
    status: passing
    allure:
      severity: critical
      categories:
        - "Rate Limiting"
        - "Auth"
        - "Security Review"

  - id: 5
    description: >
      Black-box tests for exact counter deltas per event class through /stats.
      Drive each event class against a fresh proxy with a tight window and
      assert the exact delta on the matching stats field: admission/completed
      (+1 completed, active returns to prior), oversized body (+1
      oversizedBodyRejections, upstream not contacted), cost over limit (+1
      costOverLimitRejections, upstream not contacted), queue-full (+1
      queueFullRejections), queue-timeout (+1 queueTimeoutRejections), queued
      client disconnect (+1 queuedClientDisconnects), admitted client disconnect
      (+1 activeClientDisconnects), usage reconciled (+1 usageReconciled),
      usage fallback (+1 usageEstimateFallbacks), new model name (+1 trackedModels
      at most). Each test resets to a fresh proxy child so deltas are isolated.
    verify: >-
      out=$(node --test --test-reporter=tap --test-name-pattern 'counter delta|exact delta|deltas per event' server.test.js 2>&1); rc=$?; test "$rc" -eq 0 || { printf '%s\n' "$out"; exit "$rc"; }; n=$(printf '%s\n' "$out" | grep -cE '^[[:space:]]*ok [0-9]+ - .*(counter delta|exact delta|deltas per event)'); test "$n" -ge 8 || { printf 'expected at least 8 counter-delta tests, got %s\n' "$n"; exit 1; }
    risk: P0
    security: none
    status: passing
    allure:
      severity: critical
      categories:
        - "Rate Limiting"
        - "Regression"

  - id: 6
    description: >
      Regression pin: full suite green and the default export still the only test
      seam. Confirm /stats does not change any existing route: /health, bare /v1,
      /v1/*, 401, 404, 502, 503, SSE pass-through, and the disconnect abort all
      unchanged. No new test seam added.
    verify: "npm test"
    risk: P1
    security: none
    status: passing
    allure:
      severity: high
      categories:
        - "Regression"

  - id: 7
    description: >
      Sync the living docs and the test count. Run npm test once, derive N from
      the "# tests N" TAP summary line, and fail if any living doc outside
      plans/, docs/research/config-invariant-guard-tests.md, LOG.md,
      specs/epics/*/briefs/, and specs/epics/*/*-tasks.yaml states a different
      number. Update README.md badge (tests-N%20passing) and tip, AGENTS.md count
      bullet and site list, CONVENTIONS.md, specs/README.md, tech-stack.md test
      line, specs/state.yaml handoff note, and the e04s08 story spec section 21
      risk note if it states a number. Set epic.yaml e04s08 spec/tasks filenames,
      keep status todo (not passing), and set bcps to 7. execution-status.yaml:
      e04s08 stays todo. Add specs/verifications/e04s08-verify.yaml evidence.
      Do NOT touch plans/*.md or docs/research/config-invariant-guard-tests.md.
    verify: |-
      N=$(node --test --test-reporter=tap server.test.js 2>&1 | grep -E '^# tests [0-9]+$' | grep -oE '[0-9]+')
      test -n "$N" || { echo 'no test count line'; exit 1; }
      npm test >/dev/null 2>&1 || { echo 'npm test failed'; exit 1; }
      hits=$(grep -rnE '(^|[^A-Za-z0-9])[0-9]{2,4}[ -]tests?\b|tests-[0-9]{2,4}|\(currently [0-9]+\)' --include='*.md' --include='*.yaml' . | grep -v '^\./plans/' | grep -v 'docs/research/config-invariant-guard-tests' | grep -v '/briefs/' | grep -v '^\./LOG.md' | grep -v '/specs/verifications/' | grep -v -- '-tasks.yaml')
      bad=$(printf '%s\n' "$hits" | grep -vE "(^|[^A-Za-z0-9])${N}[ -]tests?\b|tests-${N}\b|\(currently ${N}\)")
      test -z "$bad" || { printf 'stale test count (suite is %s):\n%s\n' "$N" "$bad"; exit 1; }
      grep -q 'e04s08-expose-authenticated-aggregate-stats.md' specs/epics/e04-rate-limiting/epic.yaml || { echo 'epic.yaml missing e04s08 spec'; exit 1; }
      grep -q 'e04s08-tasks.yaml' specs/epics/e04-rate-limiting/epic.yaml || { echo 'epic.yaml missing e04s08 tasks'; exit 1; }
    risk: P2
    security: none
    status: passing
    allure:
      severity: normal
      categories:
        - "Documentation"
        - "Test Count Sync"
