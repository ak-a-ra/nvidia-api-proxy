tasks:
  - id: 1
    description: >
      Extract configuration parsing from server.js into a root-level config.js exposing one
      parse entry point. It must return the existing config shape (baseURL, apiKey, proxyToken,
      unconfigured) and keep readSeconds' lenient fallback for the two timeout variables, so
      no existing test changes and the default export test seam still works.
    verify: "npm test"
    risk: P0
    security: low
    status: passing
    allure:
      severity: critical
      categories:
        - "Refactor"
        - "Config"
  - id: 2
    description: >
      Add PROXY_HOST to the config owner with default 0.0.0.0, and move the server.listen
      address to use it. Add a test that PROXY_HOST=127.0.0.1 binds loopback while header
      forwarding, credential swap, path mapping, and /health responses are unchanged.
    verify: "node --test --test-name-pattern 'PROXY_HOST' server.test.js && node -e \"const s=require('fs').readFileSync('config.js','utf8'); if(!/PROXY_HOST/.test(s)){console.error('PROXY_HOST not read by config owner');process.exit(1);} if(!/0\\.0\\.0\\.0/.test(s)){console.error('default 0.0.0.0 not preserved');process.exit(1);} console.log('no new security findings in affected paths: bind host is the only exposure change');\""
    risk: P0
    security: high
    status: passing
    allure:
      severity: critical
      categories:
        - "Config"
        - "Security Review"
  - id: 3
    description: >
      Add PROXY_RPM and PROXY_TPM parsing. Both absent or blank leaves rate limiting disabled;
      exactly one non-blank exits 1 naming the variable; non-blank values must be positive
      integers. Pin the scientific-notation decision (Number('1e3') === 1000) in a test.
    verify: "out=$(node --test --test-reporter=tap --test-name-pattern 'PROXY_RPM|PROXY_TPM' server.test.js 2>&1); rc=$?; test $rc -eq 0 && printf '%s\\n' \"$out\" | grep -qE '^[[:space:]]*ok [0-9]+ - .*(PROXY_RPM|PROXY_TPM)' && node -e \"const s=require('fs').readFileSync('config.js','utf8'); if(!/PROXY_RPM/.test(s)||!/PROXY_TPM/.test(s)){console.error('rate pair not both read');process.exit(1);} console.log('no new security findings in affected paths: partial rate policy fails closed');\""
    risk: P0
    security: high
    status: passing
    allure:
      severity: critical
      categories:
        - "Config"
        - "Security Review"
  - id: 4
    description: >
      Add PROXY_MAX_CONCURRENT_REQUESTS (absent/blank/0 disables, else positive safe integer),
      PROXY_MAX_QUEUE_SIZE (default 32), PROXY_QUEUE_TIMEOUT_SECONDS (default 30), and
      PROXY_SAFETY_MARGIN_PCT (default 5, integer 0-50). Invalid values exit 1.
    verify: "out=$(node --test --test-reporter=tap --test-name-pattern 'PROXY_MAX_CONCURRENT|PROXY_MAX_QUEUE|PROXY_QUEUE_TIMEOUT|PROXY_SAFETY_MARGIN' server.test.js 2>&1); rc=$?; test $rc -eq 0 && t=$(printf '%s\\n' \"$out\" | grep -cE '^[[:space:]]*ok [0-9]+ - ') && test \"$t\" -ge 1 && node -e \"const s=require('fs').readFileSync('config.js','utf8'); for (const v of ['PROXY_MAX_CONCURRENT_REQUESTS','PROXY_MAX_QUEUE_SIZE','PROXY_QUEUE_TIMEOUT_SECONDS','PROXY_SAFETY_MARGIN_PCT']) if(!s.includes(v)){console.error('missing '+v);process.exit(1);} console.log('no new security findings in affected paths: limits validated, not applied');\""
    risk: P0
    security: medium
    status: passing
    allure:
      severity: critical
      categories:
        - "Config"
  - id: 5
    description: >
      Add PROXY_MAX_BUFFERED_BODY_BYTES (default 8 MiB) and PROXY_MODEL_LIMITS_JSON. Malformed
      model limits are fatal whenever supplied: bad JSON, non-object root, empty model key,
      non-object entry, or invalid rpm/tpm values. Never partially applied.
    verify: "out=$(node --test --test-reporter=tap --test-name-pattern 'PROXY_MODEL_LIMITS_JSON|PROXY_MAX_BUFFERED_BODY_BYTES' server.test.js 2>&1); rc=$?; test $rc -eq 0 && t=$(printf '%s\\n' \"$out\" | grep -cE '^[[:space:]]*ok [0-9]+ - ') && test \"$t\" -ge 1 && node -e \"const s=require('fs').readFileSync('config.js','utf8'); if(!/PROXY_MODEL_LIMITS_JSON/.test(s)){console.error('model limits not validated');process.exit(1);} if(/catch\\s*\\{\\s*\\}/.test(s)){console.error('silent catch: malformed model limits must be fatal, not swallowed');process.exit(1);} console.log('no new security findings in affected paths: model limits fail closed');\""
    risk: P0
    security: medium
    status: passing
    allure:
      severity: critical
      categories:
        - "Config"
        - "Security Review"
  - id: 6
    description: >
      Add a test proving a whitespace-only operational value is treated as absent, not as a
      valid number. Number('  ') is 0, which would silently disable a budget, so the blank
      check must precede numeric parsing. The word whitespace also matches pre-existing tests and
      two from task 3, so this task's tests must name the variable they cover: the verify
      requires a passing test whose name contains whitespace and one of the variables task 4
      introduced. A test about the rate pair does not satisfy it.
    verify: "out=$(node --test --test-reporter=tap --test-name-pattern 'whitespace' server.test.js 2>&1); rc=$?; test $rc -eq 0 && t=$(printf '%s\\n' \"$out\" | grep -E '^[[:space:]]*ok [0-9]+ - .*whitespace' | grep -cE 'PROXY_MAX_CONCURRENT|PROXY_MAX_QUEUE|PROXY_QUEUE_TIMEOUT|PROXY_SAFETY_MARGIN') && test \"$t\" -ge 1 && node -e \"const s=require('fs').readFileSync('config.js','utf8'); if(!/trim\\(\\)/.test(s)){console.error('no blank check before numeric parsing');process.exit(1);} console.log('no new security findings in affected paths: blank values cannot disable a budget');\""
    risk: P0
    security: high
    status: passing
    allure:
      severity: critical
      categories:
        - "Config"
        - "Security Review"
  - id: 7
    description: >
      Write docs/adr/0002 recording the extended fail-fast vs degrade configuration regime:
      operational variables fail fast, credentials still degrade. State explicitly that the
      credential regime from ADR 0001 is unchanged and that readSeconds leniency is preserved
      for the two existing timeout variables. The ADR must also record the coverage gap task 4
      left open: the stored defaults 32 / 30 / 5 and the null that disables the concurrency
      ceiling are reviewed by eye and not by test, because the black-box child-process harness
      cannot observe the config object and this story forbids a second seam. The same holds for
      the rateLimit shape from task 3 and for every config field a later task adds. Task 5
      widens the list: the 8 MiB default, the null that means "no per-model budgets", and the
      null-prototype map are reviewed by eye too, and a duplicate top-level model key is
      accepted last-wins by JSON.parse, so one of two budgets the operator wrote for the same
      model vanishes silently. The ADR must name that fail-open as accepted, not as an oversight,
      because it is the one case where a valid document produces a stored map that does not
      match what the operator wrote.
      Task 5's review round adds two more. A model key carrying a C0 or DEL control
      character is a fatal shape named by its byte, U+XXXX, not stored and echoed; and a
      fatal message able to crash its own path must be re-proved by test rather than
      re-read, because reading it is what missed the RangeError inside describeValue.
    verify: "test -f docs/adr/0002-config-operational-fail-fast.md && grep -q 'degrade' docs/adr/0002-config-operational-fail-fast.md && grep -q '0001' docs/adr/0002-config-operational-fail-fast.md"
    risk: P1
    security: none
    status: passing
    allure:
      severity: high
      categories:
        - "Documentation"
  - id: 8
    description: >
      Add the six new domain terms (Admission control, Queue, Rate budget, Per-model budget,
      Safety margin, Usage reconciliation) to CONTEXT.md glossary, and add the nine new
      variables to the startup configuration table in specs/tech-architecture/tech-stack.md,
