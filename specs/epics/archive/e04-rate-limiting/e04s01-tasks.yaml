  - id: 12
    description: >
      Full suite green with the default export still the only test seam, then sync the new
      total into every living doc that states a count. The verify below asserts the assertion
      rather than trusting it: it derives N from npm test and fails if any hit outside
      plans/, docs/research/, LOG.md, specs/epics/*/briefs/, and specs/epics/*/*-tasks.yaml
      states a different number. Task ledgers are excluded because e01s01 carries a deliberately
      wrong count as a CI test fixture, which is not a statement about the suite. Briefs and
      LOG.md are append-only dated records of what a task reported at the time and are never
      rewritten.
    verify: "npm test && n=$(npm test 2>/dev/null | grep -E '^. tests ' | grep -oE '[0-9]+$') && grep -q \"tests-${n}%20passing\" README.md && test -z \"$(grep -rnE 'tests(-| )?[0-9]{2,4}|[0-9]{2,4}[ -]?tests?' --include='*.md' --include='*.yaml' . | grep -vE '^\\./(plans/|docs/research/|LOG\\.md|specs/epics/.*/briefs/|specs/epics/.*-tasks\\.yaml)' | grep -vE \"tests(-| )?${n}|[^0-9]${n}[ -]?tests?\")\" && echo \"count ok: ${n} across the living docs\""
    risk: P1
    security: none
    status: passing
    allure:
      severity: high
      categories:
        - "Regression"
        - "Documentation"
