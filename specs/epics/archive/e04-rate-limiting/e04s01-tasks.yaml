    verify: "grep -q 'Admission control' CONTEXT.md && grep -q 'Per-model budget' CONTEXT.md && grep -q 'PROXY_MODEL_LIMITS_JSON' specs/tech-architecture/tech-stack.md"
    risk: P1
    security: none
    status: passing
    allure:
