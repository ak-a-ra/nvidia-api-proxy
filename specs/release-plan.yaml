# release-plan

# SPDX-License-Identifier: MIT

# Release Plan

# Index only. Story status lives in specs/execution-status.yaml; epic manifests
# live in specs/epics/<capsule_dir>/epic.yaml.
#
# Source spec: GitHub issue #13 (544 lines, 150 numbered user stories) and its
# child slices #14-#22. No prior elaborate-spec run; the issue body is the spec.

```yaml
release:
  version: "1.1.0"         # mirror of next expected tag, NOT authoritative — gh release view wins
  codename: "Admission Control"
  status: planning
  semantic_release: true
  bump_hint: minor          # patch | minor | major — CI decides at merge
  scope_note: >-
    New capability, opt-in, default-off. Existing deployments must behave
    identically when the new env vars are absent, so the bump is additive.
    Two existing docs contradict this epic and are corrected as part of e01:
    CONVENTIONS.md's "never modify test files" rule (its acceptance criteria
    require new black-box HTTP tests) and its flat defensive-categories list
    (which read rate limit and retry as implemented).

epics:
  - id: e01
    title: CI workflow
    wsjf: 5.5
    capsule_dir: epics/e01-ci-workflow
    issue: 12
    note: >-
      Smallest job size in the plan and the highest risk reduction per unit of
      work: every other epic's acceptance criteria reference "the full suite
      passes in CI". Blocks nothing, gates everything.

  - id: e02
    title: Config guard tests, token side
    wsjf: 5.0
    capsule_dir: epics/e02-config-guard-tests
    issue: 10
    note: >-
      ADR 0001 §Compliance states the token-side .trim() path is not covered by
      a dedicated test. The rate-limiting epic adds new fatal config rules;
      those must land on a complete guard baseline, not a partial one.
      #13 user story 150 asks for this to land first if scheduling permits.

  - id: e03
    title: Opt-in request logging
    wsjf: 3.0
    capsule_dir: epics/e03-request-logging
    issue: 9
    note: >-
      Sequenced after e01 because it also adds tests and therefore touches the
      same test-count sync sites in every living doc.

  - id: e04
    title: Rate limiting and admission control
    wsjf: 2.9
    capsule_dir: epics/e04-rate-limiting
    issue: 13
    parent_issue: 13
    child_issues: [14, 15, 16, 17, 18, 19, 20, 21, 22]
    note: >-
      Largest job size in the plan by far (9 slices, 150 user stories), so its
      raw WSJF is low despite carrying the most business value. The ordering
      reflects size, not importance. Internally the slices are a strict linear
      blocked-by chain, so this epic cannot be parallelized:
      14 -> 15 -> 16 -> 17 -> 18 -> 19 -> 20 -> 21 -> 22.
      All nine slices are complete (e04s01-e04s09, issues #14-#22) and the
      capsule is archived to epics/archive/e04-rate-limiting.

  - id: e05
    title: Request handling
    wsjf: 4.5
    capsule_dir: epics/e05-request-handling
    child_issues: [24, 34]
    note: >-
      Two independent fixes against the request path, neither blocked by the
      other: e05s01 bounds the request body before admission control (issue
      #24) and e05s02 logs the pathname only so a secret in a query string
      never reaches stdout (issue #34).

  - id: e06
    title: Config validation
    wsjf: 4.0
    capsule_dir: epics/e06-config-validation
    child_issues: [33, 35]
    note: >-
      Two parsing corrections in config.js: e06s01 moves the upstream timeout
      variables into parseConfig so an invalid value fails at startup instead
      of silently falling back (issue #33), and e06s02 lowers the PORT floor
      check to match its own documented range (issue #35).

  - id: e07
    title: Rate-limit correctness
    wsjf: 4.2
    capsule_dir: epics/e07-rate-limit-correctness
    child_issues: [29, 32, 27]
    note: >-
      Three defects in the rate-budget layer, ordered here by blast radius
      rather than by issue number: e07s01 answers 413 instead of a permanent
      429 when one request's cost exceeds the whole TPM on its own (issue #29),
      e07s02 renames the rejection counter so it can be split by reason
      (issue #32), and e07s03 removes the silent 4096 output-token cap from
      cost estimation (issue #27).

  - id: e08
    title: Project configuration
    wsjf: 3.5
    capsule_dir: epics/e08-project-config
    child_issues: [25, 26, 31]
    note: >-
      Deploy and tooling hygiene, no runtime behavior: e08s01 pins
      traffic-protection defaults in the Render blueprint (issue #25), e08s02
      aligns the Node engine requirement with the runtime CI actually tests
      (issue #26), and e08s03 extends lint and format coverage to admission.js
      and observer.js (issue #31).

bugs:
  total: 0
  fixed: 0
  deferred: 0
  wontfix: 0
  registry: null
  note: >-
    specs/bugs/registry.yaml does not exist. All 11 closed issues #2-#8, #10,
    #11, #12, #14 were closed by direct fix; none were filed to a registry.
```
