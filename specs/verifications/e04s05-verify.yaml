manual:
  steps:
    - step: "No model limits configured"
      expected: "requests inside the global budget are all admitted by the global budget alone"
      actual: "the global budget admits alone when PROXY_MODEL_LIMITS_JSON is absent — pass"
    - step: "Model RPM limit enforced"
      expected: "the first two requests are admitted, the third is 429 with a positive integer Retry-After and the upstream never sees it"
      actual: "a model_rpm rejection answers 429 with a derived Retry-After and does not reach the upstream — pass"
    - step: "Model TPM limit enforced"
      expected: "a request whose estimated cost exceeds the model's token budget is 429"
      actual: "a model_tpm rejection answers 429 — pass"
    - step: "Unknown model falls through to the global budget"
      expected: "a request naming an unconfigured model is admitted by the global budget and no model window is consulted"
      actual: "unknown model falls through to global only — pass"
    - step: "Atomic reservation"
      expected: "a model rejection leaves the global counters uncharged"
      actual: "atomic reservation: the global window is not charged for the rejected request — pass"
    - step: "Partial model entry (rpm only)"
      expected: "the rpm dimension caps, the token dimension stays uncapped for that model"
      actual: "partial entry: a model entry with only rpm leaves its token budget uncapped — pass"
    - step: "Model limits without a global pair"
      expected: "per-model limits have no effect and requests stream through without buffering"
      actual: "the gate never opens: the request is admitted and a body above the cap is forwarded verbatim — pass"
    - step: "close() closes the model windows"
      expected: "model windows refuse new reservations after close()"
      actual: "close refuses model reservations — pass"

