divergences:
  - id: budget-wait
    issue_bullet: "waiting for budget is event-driven only: no polling. Blocking budget waits respect downstream client disconnect"
    decision: "Not implemented in this slice; the immediate-429-with-derived-Retry-After answers the same intent"
    rationale: "ADR 0002 §1.6 and the story spec §6. A wait would park a caller and its slot for up to 59 seconds for a state only the clock controls; the immediate 429 carries a Retry-After derived from the window's own oldest reservation. The early-release wait lands in a later slice"
    lands_in: "#19-#22"

