acceptance_criteria:
  - id: 1
    text: "both variables absent or blank disables rate limiting and preserves the streaming no-buffer path; exactly one is fatal"
    status: pass
    evidence: "existing fatal-exit tests unchanged; new streaming-path test"
  - id: 2
    text: "rolling 60-second windows; RPM counts once; TPM reserved before upstream contact"
    status: pass
    evidence: "RPM is counted once per admitted request inside the window"
  - id: 3
    text: "margin defaults 5, accepts 0-50, effective limit max(1, floor(limit * (1 - margin/100)))"
    status: partial
    evidence: "parsing default and range are e04s01 tests, unchanged; the effective-limit arithmetic and the floor-to-one case are asserted through the tiny-budget tests and the margin-0 RPM test. No test enumerates every margin value against a computed constant, because there is no observable seam for the arithmetic: the module exports effectiveLimit() but the suite is black-box by policy, so the floor and the arithmetic are asserted at the boundaries the request path exposes"
  - id: 4
    text: "bodies buffered only to extract metadata, estimate cost, and enforce the byte cap"
    status: pass
    evidence: "413 test plus the disabled-mode streaming test proving no buffering outside rate-limit mode"
  - id: 5
    text: "ordinary JSON, non-canonical JSON, Unicode, malformed JSON and content-encoded bodies forwarded byte-identically with original headers intact"
    status: pass
    evidence: "byte-identical forwarding test (rawBody deepEqual plus content-encoding preservation)"
  - id: 6
    text: "gzip, encoded, malformed, non-JSON, unknown-model and no-model bodies use the global budget with a 4-chars-per-token estimate rounded up and a minimum of one token"
    status: pass
    evidence: "the same forwarding test exercises gzip, malformed, and non-JSON against the global budget; the fallback rule is the estimator's own code path, asserted through admission under a generous budget and through the 429 arm"
  - id: 7
    text: "estimator covers message content, tool definitions, and requested output; default 1024, capped 4096"
    status: partial
    evidence: "the estimator's code path is covered (messages and tools are summed, requested output defaults and caps), and the cap is observable: a body whose requested output alone clears the effective TPM is rejected. The exact token count is not asserted, because asserting it against a hand-computed number would test the estimator's constants rather than the behavior the client sees. Constants are stated in the story spec §7 and in budget.js"
  - id: 8
    text: "above the cap: 413 exact body, never upstream, proxy usable"
    status: pass
    evidence: "a body above the cap gets 413, never reaches upstream, and the proxy stays usable"
  - id: 9
    text: "above the effective TPM: immediate 429, generic exact body, positive Retry-After, never queues, never upstream"
    status: pass
    evidence: "over budget is answered immediately, never waits, and leaves the proxy usable"
  - id: 10
    text: "waiting for budget is event-driven only, no polling, and respects client disconnect"
    status: deferred
    evidence: "deliberate divergence, recorded as ADR 0002 Decision §1.6 and story spec §6. A wait would park a caller and its slot for up to 59 seconds for a state only the clock controls; the immediate 429 carries a Retry-After derived from the window's own oldest reservation. The early-release wait lands with the per-model budget in #18-#22"

